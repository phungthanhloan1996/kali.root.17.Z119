{% extends "base.html" %}

{% block content %}
  <h2>Đổi mật khẩu</h2>
  <form method="post" class="password-change-form">
    {% csrf_token %}

    <div class="form-group">
      <label for="id_old_password">Mật khẩu cũ</label>
      <input type="text" name="old_password" value="{{ form.old_password.value }}" id="id_old_password" class="form-control" required />
    </div>

    <div class="form-group">
      <label for="id_new_password1">Mật khẩu mới</label>
      <input type="text" name="new_password1" value="{{ form.new_password1.value }}" id="id_new_password1" class="form-control" required />
    </div>

    <div class="form-group">
      <label for="id_new_password2">Nhập lại mật khẩu mới</label>
      <input type="text" name="new_password2" value="{{ form.new_password2.value }}" id="id_new_password2" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
  </form>
{% endblock %}
