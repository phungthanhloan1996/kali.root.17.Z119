{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h2>Thêm công nhân</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_name">Tên công nhân:</label>
                {{ form.name }}
            </div>
            <div class="form-group">
                <label for="id_rank">Cấp bậc:</label>
                {{ form.rank }}
            </div>
            <div class="form-group">
                <label for="id_position">Chức vụ:</label>
                {{ form.position }}
            </div>
            <div class="form-group">
                <label for="id_phone_number">Số điện thoại:</label>
                {{ form.phone_number }}
            </div>
            <button type="submit" class="btn-primary">Lưu thông tin công nhân</button>
        </form>
    </div>
    <a href="{% url 'logout' %}" class="logout-link">🔒 Đăng xuất</a>
{% endblock %}

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm công nhân</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            width: 480px;
            max-width: 100%;
            margin: 20px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 16px;
            background-color: #f1f5f9;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4c8bf5;
            outline: none;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .logout-link {
            color: #ef4444;
            text-decoration: none;
            font-size: 16px;
            margin-top: 20px;
            display: inline-block;
        }

        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
