{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h2 {
            margin: 30px 0;
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
        }
        .product-list {
            max-width: 700px;
            margin: 0 auto;
        }
        .list-group-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .list-group-item:hover {
            background-color: #e9f5ff;
            transform: translateX(5px);
        }
        .back-btn {
            margin-top: 30px;
            text-align: center;
        }
        a.full-link {
            display: block;
            text-decoration: none;
            color: inherit;
            font-weight: 500;
            padding: 15px;
        }
        a.full-link:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Danh sách sản phẩm có trong các phiếu đặt hàng</h2>

    <div class="product-list">
        {% if products %}
            <ul class="list-group shadow-sm rounded">
                {% for product in products %}
                    <li class="list-group-item">
                        <a href="{% url 'order_items_by_product' product.id %}" class="full-link">
                            {{ product.name }}
                        </a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="alert alert-info text-center mt-4">
                Chưa có sản phẩm nào trong phiếu đặt hàng.
            </div>
        {% endif %}
    </div>

    <div class="back-btn">
        <a href="{% url 'order_list' %}" class="btn btn-secondary btn-lg">
            ⬅ Quay lại danh sách phiếu
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
